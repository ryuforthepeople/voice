<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌐 Free API Catalog — 500 Public APIs</title>
  <link rel="stylesheet" href="catalog.css">
</head>
<body>
  <header>
    <h1>🌐 Free API Catalog</h1>
    <p>500 free public APIs for building applications</p>
    <p class="last-checked" id="lastChecked"></p>
  </header>
  <div class="controls">
    <input id="search" type="text" placeholder="Search APIs by name or description…">
    <div class="auth-filters">
      <button class="auth-btn active" data-auth="all">All</button>
      <button class="auth-btn" data-auth="none">No Auth</button>
      <button class="auth-btn" data-auth="apikey">API Key</button>
      <button class="auth-btn" data-auth="oauth">OAuth</button>
    </div>
    <div class="grade-filters">
      <button class="grade-btn active" data-grade="all">All Grades</button>
      <button class="grade-btn" data-grade="A+">⭐ A+</button>
      <button class="grade-btn" data-grade="A">🟢 A+/A</button>
      <button class="grade-btn" data-grade="B">🔵 B+</button>
      <button class="grade-btn" data-grade="C">🟡 C+</button>
      <button class="grade-btn" data-grade="D">🟠 D+</button>
      <button class="grade-btn" data-grade="F">🔴 F</button>
    </div>
    <select id="sortBy">
      <option value="id">Sort: Default</option>
      <option value="score-desc">Sort: Score ↓</option>
      <option value="score-asc">Sort: Score ↑</option>
      <option value="name">Sort: Name A-Z</option>
    </select>
    <span id="count"></span>
  </div>
  <div class="layout">
    <nav class="sidebar"></nav>
    <main class="grid"></main>
  </div>
  <!-- Detail Panel -->
  <div class="detail-overlay" id="detailOverlay"></div>
  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <button class="detail-close" id="detailClose">✕</button>
      <div class="detail-title-row">
        <h2 class="detail-name" id="detailName"></h2>
        <span class="grade-badge" id="detailGrade"></span>
      </div>
      <div class="detail-meta-row">
        <span class="cat-tag" id="detailCategory"></span>
        <span class="badge" id="detailAuth"></span>
        <span class="detail-https" id="detailHttps"></span>
      </div>
      <p class="detail-desc" id="detailDesc"></p>
      <a class="detail-docs-link" id="detailDocs" href="#" target="_blank" rel="noopener">📄 Official Docs ↗</a>
    </div>

    <div class="detail-section">
      <h3>⚡ Quick Start</h3>
      <div class="code-tabs">
        <button class="code-tab active" data-lang="js">JavaScript</button>
        <button class="code-tab" data-lang="curl">cURL</button>
        <button class="code-tab" data-lang="python">Python</button>
      </div>
      <div class="code-block-wrapper">
        <button class="copy-btn" title="Copy">📋</button>
        <pre class="code-block" id="codeBlock"></pre>
      </div>
    </div>

    <div class="detail-section">
      <h3>🧪 Live Playground</h3>
      <div class="playground">
        <button class="try-btn" id="tryBtn">▶ Try it</button>
        <div class="playground-result" id="playgroundResult">
          <div class="playground-placeholder">Click "Try it" to send a request</div>
        </div>
      </div>
    </div>

    <div class="detail-section">
      <h3>ℹ️ Info</h3>
      <div class="info-grid" id="infoGrid"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="health-data.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
